<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trang thông tin cá nhân sinh viên.">
  <title>Thông tin cá nhân</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #eef3f9; color: #18283d; font-family: Arial, Helvetica, sans-serif; line-height: 1.6; }
    main { width: 100%; max-width: 620px; overflow: hidden; background: #fff; border: 1px solid #dce5ef; border-radius: 24px; box-shadow: 0 20px 60px #18283d12; }
    header { padding: 36px; background: #153b60; color: #fff; }
    .eyebrow { margin: 0 0 12px; color: #b9d7f3; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(26px, 5vw, 34px); line-height: 1.25; }
    .intro { margin: 12px 0 0; color: #d7e6f4; font-size: 15px; }
    dl { margin: 0; padding: 12px 36px; }
    .field { padding: 20px 0; border-bottom: 1px solid #e7edf4; }
    .field:last-child { border-bottom: 0; }
    dt { margin-bottom: 5px; color: #52657a; font-size: 13px; font-weight: 700; }
    dd { margin: 0; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
    footer { padding: 18px 36px; background: #f8fafc; border-top: 1px solid #e7edf4; color: #52657a; font-size: 12px; }
    @media (max-width: 420px) { body { padding: 16px; } header { padding: 28px 24px; } dl { padding: 8px 24px; } footer { padding: 16px 24px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Hồ sơ sinh viên</p>
      <h1>Thông tin cá nhân</h1>
      <p class="intro">Thông tin sinh viên và môn học</p>
    </header>
    <!-- Thay nội dung trong 4 thẻ dd bên dưới bằng thông tin của bạn. -->
    <dl>
      <div class="field">
        <dt>Họ và tên</dt>
        <dd>Vũ Đức Dương</dd>
      </div>
      <div class="field">
        <dt>Mã số sinh viên (MSSV)</dt>
        <dd>20235313</dd>
      </div>
      <div class="field">
        <dt>Lớp</dt>
        <dd>172920</dd>
      </div>
      <div class="field">
        <dt>Môn học</dt>
        <dd>IT4409</dd>
      </div>
    </dl>
    <footer>Công nghệ Web và dịch vụ trực tuyến</footer>
  </main>
</body>
</html>
